name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    name: Build & Lint Check
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Swift Build
        run: |
          swift build -v

      - name: Package Verification
        run: |
          chmod +x Scripts/build_dmg.sh Scripts/build_app.sh
          ./Scripts/build_dmg.sh release
          test -f build/MacScanner.dmg
          echo "✅ Release build and DMG generation passed."

