name: Release

# Builds MacScanner.app and MacScanner.dmg on a GitHub-hosted macOS runner
# and attaches the .dmg installer to a GitHub Release whenever a version tag is pushed.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build MacScanner.app and MacScanner.dmg
        run: |
          chmod +x Scripts/build_dmg.sh Scripts/build_app.sh
          ./Scripts/build_dmg.sh release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/MacScanner.dmg
            build/MacScanner.app
          generate_release_notes: true
