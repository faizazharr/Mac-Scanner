name: Release

# Automatically builds and publishes MacScanner.dmg to GitHub Releases
# whenever a semantic version tag (e.g. v1.0.0) is pushed to master.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Semantic Version Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-and-release:
    name: Build & Publish Release DMG
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Optimized Release DMG
        run: |
          chmod +x Scripts/build_dmg.sh Scripts/build_app.sh
          ./Scripts/build_dmg.sh release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/MacScanner.dmg
          generate_release_notes: true
          draft: false
          prerelease: false
